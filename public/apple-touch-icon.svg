<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" fill="#10b981" rx="27"/>
  
  <!-- Wheat/grain stalks representing fiber -->
  <g transform="translate(90, 90)">
    <!-- Center stalk -->
    <line x1="0" y1="27" x2="0" y2="-45" stroke="#ffffff" stroke-width="5.3999999999999995" stroke-linecap="round"/>
    <ellipse cx="0" cy="-48.6" rx="10.799999999999999" ry="16.2" fill="#ffffff"/>
    
    <!-- Left stalk -->
    <line x1="-21.599999999999998" y1="27" x2="-21.599999999999998" y2="-32.4" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="-21.599999999999998" cy="-36" rx="9" ry="12.600000000000001" fill="#ffffff"/>
    
    <!-- Right stalk -->
    <line x1="21.599999999999998" y1="27" x2="21.599999999999998" y2="-32.4" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="21.599999999999998" cy="-36" rx="9" ry="12.600000000000001" fill="#ffffff"/>
    
    <!-- Additional grain details -->
    <ellipse cx="-7.2" cy="-43.199999999999996" rx="5.3999999999999995" ry="9" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="7.2" cy="-43.199999999999996" rx="5.3999999999999995" ry="9" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- "F" letter at bottom for Fiber -->
  <text x="90" y="144" font-family="Arial, sans-serif" font-size="62.99999999999999" font-weight="bold" fill="#ffffff" text-anchor="middle">F</text>
</svg>