<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#10b981" rx="76.8"/>
  
  <!-- Wheat/grain stalks representing fiber -->
  <g transform="translate(256, 256)">
    <!-- Center stalk -->
    <line x1="0" y1="76.8" x2="0" y2="-128" stroke="#ffffff" stroke-width="15.36" stroke-linecap="round"/>
    <ellipse cx="0" cy="-138.24" rx="30.72" ry="46.08" fill="#ffffff"/>
    
    <!-- Left stalk -->
    <line x1="-61.44" y1="76.8" x2="-61.44" y2="-92.16" stroke="#ffffff" stroke-width="12.8" stroke-linecap="round"/>
    <ellipse cx="-61.44" cy="-102.4" rx="25.6" ry="35.84" fill="#ffffff"/>
    
    <!-- Right stalk -->
    <line x1="61.44" y1="76.8" x2="61.44" y2="-92.16" stroke="#ffffff" stroke-width="12.8" stroke-linecap="round"/>
    <ellipse cx="61.44" cy="-102.4" rx="25.6" ry="35.84" fill="#ffffff"/>
    
    <!-- Additional grain details -->
    <ellipse cx="-20.48" cy="-122.88" rx="15.36" ry="25.6" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="20.48" cy="-122.88" rx="15.36" ry="25.6" fill="#ffffff" opacity="0.8"/>
